<div class="st-cq-settings">
    <div class="inline-drawer">
        <div class="inline-drawer-toggle inline-drawer-header">
            <b>Character QOLs</b>
            <div class="inline-drawer-icon fa-solid fa-circle-chevron-down down"></div>
        </div>
        <div class="inline-drawer-content">
            <label class="checkbox_label" for="st_cq_enabled">
                <input id="st_cq_enabled" type="checkbox">
                <span>Preview characters in a popup</span>
            </label>
            <small class="st-cq-setting-hint">
                Clicking a character card opens a details popup instead of loading its chat.
                Start the chat with the Chat button in the popup.
            </small>
        </div>
    </div>
</div>
